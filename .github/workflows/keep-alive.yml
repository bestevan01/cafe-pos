name: Keep Render Server Alive
# 역할 분담:
#  - 이 워크플로: 아침에 '완전히 잠든' Render 인스턴스를 깨우는 용도.
#    Render가 cron-job.org 요청은 봇으로 보고 거부하는데 GitHub 요청은 받아주기 때문에,
#    콜드 상태에서 최초로 깨우는 일은 반드시 여기서 해야 한다.
#  - 이후 영업시간 동안 깨어 있게 유지하는 것은 cron-job.org가 담당한다.
#    (Asia/Seoul 기준 '*/10 8-17 * 3-6,9-12 1-5' — 마지막 핑 17:50 + 유휴 15분 = 18:05 종료)
#    영업은 09~17시이고, 관리자 퇴근 시각 18시까지 여유를 둔 값이다.
#    참고: Render는 '15분간 인바운드 트래픽 없음'이면 절전한다. 기존 연결의 WebSocket
#    메시지도 트래픽으로 세므로, 직원이 POS 화면을 켜두면 소켓 하트비트만으로도 유지된다.
#    cron-job.org의 실질 역할은 아무도 접속하지 않은 공백 구간을 메우는 것이다.
on:
  schedule:
    # ⚠️ GitHub Actions cron은 UTC 전용. KST = UTC+9라 23시 UTC = 다음 날 08시 KST.
    #
    # 요일(0-4 = UTC 일~목)은 KST 월~금으로 정확히 대응되므로 cron에서 걸러도 안전하다.
    # 하지만 '월'은 하루 밀림 때문에 cron에서 거를 수 없다.
    #   예) KST 9/1 08:05 = UTC 8/31 23:05 → cron 월 필터에 8월이 없으면 학기 첫날이 비어버린다.
    # 그래서 월 범위는 경계달(2월·8월)까지 넉넉히 열어두고,
    # 실제 운영월 판단은 아래 스텝에서 KST 기준으로 한다.
    # GitHub 예약은 best-effort다. 부하가 몰리면 늦게 실행되고, 심하면 예약이 통째로 버려진다
    # (2026-09-01 아침은 예약 6회 중 0회 실행 → 학기 첫날 서버가 안 깨어남).
    # 대응 두 가지:
    #  1) 두 시간대로 나눈다. 한쪽이 통째로 누락돼도 다른 쪽이 남는다.
    #  2) '분'을 정시·30분에서 비켜 둔다. 문서가 지목하는 혼잡 시각이 매시 정각이고,
    #     회피책으로 "schedule your workflow to run at a different time of the hour"를 권한다.
    #     실측으로도 분 0·30을 쓴 사흘은 그날 첫 실행이 08:55였고,
    #     분 5~55를 쓰던 이전에는 08:31이었다. 24분 차이는 개점(09:00) 직전 여유에서 그대로 깎인다.
    - cron: '7,37 22 * 2-6,8-12 0-4' # KST 07:07 / 07:37
    - cron: '7,37 23 * 2-6,8-12 0-4' # KST 08:07 / 08:37
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      # 한 서버가 느리거나 죽어 있어도 나머지는 계속 깨우도록 서로 독립 실행한다.
      fail-fast: false
      matrix:
        include:
          - name: 본부동
            url: https://cafe-server-0qur.onrender.com
          - name: 은혜관
            url: https://cafe-pos-kk4t.onrender.com
    # develop 브랜치로 배포되는 테스트 서버(cafe-server-beta)는 상시 가동이 필요 없어 제외한다.
    name: Ping ${{ matrix.name }}
    steps:
      - name: Ping Server
        run: |
          # 학기 운영월(KST 3~6월, 9~12월)이 아니면 Render를 깨우지 않고 끝낸다.
          # cron이 아니라 여기서 판단하는 이유는 위 주석 참고.
          KST_MONTH=$(TZ=Asia/Seoul date +%m)
          case "$KST_MONTH" in
            03 | 04 | 05 | 06 | 09 | 10 | 11 | 12) ;;
            *)
              echo "방학 기간 (KST ${KST_MONTH}월) — 건너뜀"
              exit 0
              ;;
          esac

          # 어느 예약이 실제로 발동했는지 남긴다. 드롭된 예약은 실행 자체가 생성되지 않아
          # 실행 목록에 흔적이 없고, API도 발동 cron을 알려주지 않는다. 여기서만 확인 가능하다.
          # (수동 실행일 때는 비어 있다)
          echo "trigger: ${{ github.event.schedule || 'workflow_dispatch' }}"

          # 콜드스타트는 최대 ~60초까지 걸리므로 넉넉히 기다린다.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "${{ matrix.url }}/ping")
          echo "$(TZ=Asia/Seoul date '+%F %T KST') ${{ matrix.name }} (${{ matrix.url }}) -> $code"
