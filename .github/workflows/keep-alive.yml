name: Keep Render Server Alive
# 역할 분담:
#  - 이 워크플로: 아침에 '완전히 잠든' Render 인스턴스를 깨우는 용도.
#    Render가 cron-job.org 요청은 봇으로 보고 거부하는데 GitHub 요청은 받아주기 때문에,
#    콜드 상태에서 최초로 깨우는 일은 반드시 여기서 해야 한다.
#  - 이후 영업시간 동안 깨어 있게 유지하는 것은 cron-job.org가 담당한다.
#    (Asia/Seoul 기준 '*/10 8-19 * 3-6,9-12 1-5')
on:
  schedule:
    # ⚠️ GitHub Actions cron은 UTC 전용. KST = UTC+9라 23시 UTC = 다음 날 08시 KST.
    #
    # 요일(0-4 = UTC 일~목)은 KST 월~금으로 정확히 대응되므로 cron에서 걸러도 안전하다.
    # 하지만 '월'은 하루 밀림 때문에 cron에서 거를 수 없다.
    #   예) KST 9/1 08:05 = UTC 8/31 23:05 → cron 월 필터에 8월이 없으면 학기 첫날이 비어버린다.
    # 그래서 월 범위는 경계달(2월·8월)까지 넉넉히 열어두고,
    # 실제 운영월 판단은 아래 스텝에서 KST 기준으로 한다.
    - cron: '5/10 23 * 2-6,8-12 0-4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      # 한 서버가 느리거나 죽어 있어도 나머지는 계속 깨우도록 서로 독립 실행한다.
      fail-fast: false
      matrix:
        include:
          - name: 본부동
            url: https://cafe-server-0qur.onrender.com
          - name: 은혜관
            url: https://cafe-pos-kk4t.onrender.com
    # develop 브랜치로 배포되는 테스트 서버(cafe-server-beta)는 상시 가동이 필요 없어 제외한다.
    name: Ping ${{ matrix.name }}
    steps:
      - name: Ping Server
        run: |
          # 학기 운영월(KST 3~6월, 9~12월)이 아니면 Render를 깨우지 않고 끝낸다.
          # cron이 아니라 여기서 판단하는 이유는 위 주석 참고.
          KST_MONTH=$(TZ=Asia/Seoul date +%m)
          case "$KST_MONTH" in
            03 | 04 | 05 | 06 | 09 | 10 | 11 | 12) ;;
            *)
              echo "방학 기간 (KST ${KST_MONTH}월) — 건너뜀"
              exit 0
              ;;
          esac

          # 콜드스타트는 최대 ~60초까지 걸리므로 넉넉히 기다린다.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "${{ matrix.url }}/ping")
          echo "$(TZ=Asia/Seoul date '+%F %T KST') ${{ matrix.name }} (${{ matrix.url }}) -> $code"
