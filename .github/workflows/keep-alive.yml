name: Keep Render Server Alive
on:
  schedule:
    # ⚠️ GitHub Actions cron은 UTC 기준. KST = UTC+9 이므로 23시 UTC = 다음날 08시 KST.
    # 요일도 하루 밀리므로 UTC 일~목(0-4)이 KST 월~금이 된다. (기존 1-5는 KST 화~토가 되어
    # 영업일인 월요일 아침이 비고, 비영업일인 토요일 아침에 낭비되고 있었음)
    # → 영업(월~목 09~18시) 시작 직전인 KST 08:05~08:55에 10분 간격으로 깨워 콜드스타트 방지.
    - cron: '5/10 23 * 3-6,9-12 0-4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      # 한 서버가 느리거나 죽어 있어도 나머지는 계속 깨우도록 서로 독립 실행한다.
      fail-fast: false
      matrix:
        include:
          - name: 본부동
            url: https://cafe-server-0qur.onrender.com
          - name: 은혜관
            url: https://cafe-pos-kk4t.onrender.com
    # develop 브랜치로 배포되는 테스트 서버(cafe-server-beta)는 상시 가동이 필요 없어 제외한다.
    name: Ping ${{ matrix.name }}
    steps:
      - name: Ping Server
        run: |
          # 콜드스타트는 최대 ~60초까지 걸리므로 넉넉히 기다린다.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "${{ matrix.url }}/ping")
          echo "${{ matrix.name }} (${{ matrix.url }}) -> $code"
